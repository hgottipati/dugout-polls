<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Bebas Neue";
      src: url("./og-assets/BebasNeue-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Nunito";
      src: url("./og-assets/Nunito-ExtraBold.ttf") format("truetype");
      font-weight: 800;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #102a43;
    }
    .bg {
      position: absolute;
      inset: 0;
      background: #16382b url("./og-assets/field.jpg") center / cover no-repeat;
    }
    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(16, 42, 67, 0.82) 0%, rgba(16, 42, 67, 0.42) 46%, rgba(16, 42, 67, 0.08) 100%),
        linear-gradient(180deg, rgba(16, 42, 67, 0.15) 0%, rgba(16, 42, 67, 0.72) 100%);
    }
    .stitch {
      position: absolute;
      left: 0;
      top: 28px;
      bottom: 28px;
      width: 10px;
      background: repeating-linear-gradient(
        to bottom,
        #c1121f 0 12px,
        transparent 12px 22px
      );
    }
    .copy {
      position: absolute;
      left: 72px;
      right: 420px;
      bottom: 58px;
      color: #f8f4ea;
      font-family: "Nunito", sans-serif;
    }
    .kicker {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e9c46a;
    }
    h1 {
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: 168px;
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 0.82;
    }
    .sub {
      margin: 16px 0 0;
      font-size: 30px;
      font-weight: 800;
      color: #f4efe4;
    }
    .pill {
      display: inline-block;
      margin-top: 22px;
      background: #2d6a4f;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 22px;
      border-radius: 999px;
    }
    .ball {
      position: absolute;
      right: 64px;
      bottom: 64px;
      width: 236px;
      height: 236px;
      border-radius: 50%;
      object-fit: cover;
      border: 7px solid #f4f1e8;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="stitch"></div>
  <div class="copy">
    <p class="kicker">Team polls</p>
    <h1>Dugout</h1>
    <p class="sub">Share a link. People vote.</p>
    <span class="pill">Tap to vote</span>
  </div>
  <img class="ball" src="./og-assets/baseball.jpg" alt="" />
</body>
</html>
